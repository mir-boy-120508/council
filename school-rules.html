<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfd">
  <meta name="description" content="橘中学校が正式に確認・承認した校内生活のきまりを掲載します。">
  <title>校内のきまり — 橘中学校 生徒会公式プラットフォーム</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="school-rules">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <nav class="breadcrumb" aria-label="現在位置">
        <ol>
          <li><a href="index.html">ホーム</a></li>
          <li aria-current="page">校内のきまり</li>
        </ol>
      </nav>
    </div>

    <section class="page-header">
      <div class="container">
        <p class="page-header-eyebrow">学校承認済み公式ガイド</p>
        <h1>校内のきまり</h1>
        <p class="page-header-lead">学校が正式に確認・承認した最新の校内ルールを掲載します。未承認の情報や古い規定は掲載しません。</p>
      </div>
    </section>

    <section class="section">

        <div class="toolbar">

          <div class="search-box">
            <input type="search" id="rules-search" class="search-input" placeholder="ルールを検索（例：登校、端末）" aria-label="校内のきまり検索">
          </div>
        </div>

        <div id="rules-list-container"></div>

        <div class="related-links">
          <p class="related-links-title">関連ページ</p>
          <div class="related-links-grid">
            <a class="related-link-item" href="petitions.html"><span>ルールの見直しを提案する</span><span>›</span></a>
            <a class="related-link-item" href="feedback.html"><span>きまりについて質問する</span><span>›</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/site.js"></script>
  <script src="js/pages.js"></script>
