<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfd">
  <meta name="description" content="橘中学校生徒会からの公式発表、お知らせ、活動報告の一覧。">
  <title>お知らせ — 橘中学校 生徒会公式プラットフォーム</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="newsroom">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <nav class="breadcrumb" aria-label="現在位置">
        <ol>
          <li><a href="index.html">ホーム</a></li>
          <li aria-current="page">お知らせ</li>
        </ol>
      </nav>
    </div>

    <section class="page-header">
      <div class="container">
        <p class="page-header-eyebrow">生徒会からの公式情報</p>
        <h1>お知らせ・活動報告</h1>
        <p class="page-header-lead">生徒会からの連絡事項、決定した取り組みの公式発表、各委員会の活動記録を掲載します。</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="toolbar">
          <div class="filter-pills" role="group" aria-label="カテゴリー絞り込み">
            <button type="button" class="filter-pill active" data-news-cat="all">すべて</button>
            <button type="button" class="filter-pill" data-news-cat="お知らせ">お知らせ</button>
            <button type="button" class="filter-pill" data-news-cat="公式発表">公式発表</button>
            <button type="button" class="filter-pill" data-news-cat="活動報告">活動報告</button>
          </div>
          <div class="search-box">
            <input type="search" id="news-search" class="search-input" placeholder="キーワードで検索" aria-label="お知らせ検索">
            <select id="news-sort" class="form-control" style="width:auto; border-radius:999px; padding:8px 14px; font-size:0.875rem;" aria-label="並び替え">
              <option value="desc">新しい順</option>
              <option value="asc">古い順</option>
            </select>
          </div>
        </div>

        <div id="news-list-container"></div>

        <div class="related-links">
          <p class="related-links-title">関連ページ</p>
          <div class="related-links-grid">
            <a class="related-link-item" href="progress.html"><span>活動の進捗を確認する</span><span>›</span></a>
            <a class="related-link-item" href="events.html"><span>イベント案内を見る</span><span>›</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="news-modal" role="dialog" aria-modal="true" aria-label="記事詳細">
    <div class="modal-dialog">
      <button type="button" class="modal-close" aria-label="閉じる" onclick="document.getElementById('news-modal').classList.remove('open')">✕</button>
      <div id="news-modal-content"></div>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/site.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
