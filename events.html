<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント | 橘中学校 生徒会公式プラットフォーム</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="theme-dark">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <nav class="breadcrumb" aria-label="パンくずリスト">
        <ol><li><a href="index.html">ホーム</a></li><li>イベント</li></ol>
      </nav>
      <div class="page-header">
        <span class="eyebrow">生徒会主催行事・対話企画</span>
        <h1>イベント・全校集会案内</h1>
        <p class="page-lead">生徒総会、昼休み対話会、ボランティア活動など、全校生徒が参加できる企画の日時と開催場所を案内しています。</p>
      </div>
    </div>

    <section class="band-tight">
      <div class="container">
        <div class="section-head">
          <h2>開催予定のイベント</h2>
        </div>
        <div id="upcoming-events"></div>

        <div class="section-head" style="margin-top:64px;">
          <h2>実施済みのイベント記録</h2>
        </div>
        <div id="past-events"></div>

        <div class="inline-notice" style="margin-top:48px;">
          ライブ動画配信や同時視聴プレミア機能は本バージョンでは提供していません。当日の要旨や資料は終了後に「お知らせ」へ掲載します。
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { initCommonLayout, escapeHtml, statusDot } from './js/common.js';
    import { store } from './js/store.js';

    initCommonLayout('events.html');

    const events = store.getState().events;
    const upcoming = events.filter(e => ['upcoming', 'ongoing'].includes(e.status));
    const past = events.filter(e => !['upcoming', 'ongoing', 'draft'].includes(e.status));

    document.getElementById('upcoming-events').innerHTML = upcoming.length ? upcoming.map(ev => `
      <article class="event-feature">
        <div class="progress-meta-row">
          ${statusDot('開催予定', 'accent')}
          <span>${escapeHtml(ev.startAt ? new Date(ev.startAt).toLocaleString('ja-JP') : ev.date || '')}</span>
          <span>会場：${escapeHtml(ev.location)}</span>
        </div>
        <h3 style="font-size:1.375rem;margin:0 0 10px;">${escapeHtml(ev.title)}</h3>
        <p class="editorial-excerpt">${escapeHtml(ev.description || ev.summary || '')}</p>
        ${(ev.archiveNote || ev.notes) ? `<p style="font-size:0.875rem;color:var(--text-secondary);margin:14px 0 0;">参加案内：${escapeHtml(ev.archiveNote || ev.notes)}</p>` : ''}
      </article>
    `).join('') : `
      <div class="empty-notice">
        <p class="empty-notice-title">現在予定されているイベントはありません</p>
        <p class="empty-notice-desc">次回の生徒総会や対話企画が決まり次第、こちらに掲載します。</p>
      </div>
    `;

    document.getElementById('past-events').innerHTML = past.length ? `
      <div class="editorial-list">
        ${past.map(ev => `
          <article class="editorial-row">
            <div class="editorial-meta">
              <span>${escapeHtml(ev.startAt ? new Date(ev.startAt).toLocaleDateString('ja-JP') : ev.date || '')}</span>
              <span>${escapeHtml(ev.location)}</span>
            </div>
            <div>
              <h3 class="editorial-title">${escapeHtml(ev.title)}</h3>
              <p class="editorial-excerpt">${escapeHtml(ev.description || ev.summary || '')}</p>
              ${(ev.archiveNote || ev.notes) ? `<p style="font-size:0.875rem;color:var(--text-secondary);margin:8px 0 0;">実施報告：${escapeHtml(ev.archiveNote || ev.notes)}</p>` : ''}
            </div>
            <span></span>
          </article>
        `).join('')}
      </div>
    ` : `
      <div class="empty-notice">
        <p class="empty-notice-title">過去のイベント記録はまだありません</p>
      </div>
    `;
  </script>
</body>
</html>
