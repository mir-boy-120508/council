<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | 橘中学校 生徒会公式プラットフォーム</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <div class="container-narrow">
      <nav class="breadcrumb" aria-label="パンくずリスト">
        <ol><li><a href="index.html">ホーム</a></li><li>ログイン</li></ol>
      </nav>
      <div class="page-header">
        <span class="eyebrow">学校アカウント認証</span>
        <h1>ログイン</h1>
        <p class="page-lead">提案の作成・賛同署名・意見送信および管理画面の利用には、学校付与のアカウントでログインしてください。</p>
      </div>
    </div>

    <section class="band-tight">
      <div class="container-narrow">
        <div id="auth-mode-notice"></div>

        <div class="form-section">
          <form id="form-login">
            <div class="field">
              <label class="field-label" for="login-name">氏名（学年・組）<span class="field-req">必須</span></label>
              <input type="text" id="login-name" name="displayName" class="field-control" required placeholder="例：橘 太郎（2年1組）">
            </div>
            <div class="field">
              <label class="field-label" for="login-email">学校メールアドレス<span class="field-req">必須</span></label>
              <input type="email" id="login-email" name="email" class="field-control" required placeholder="例：student.201@tachibana-jhs.ed.jp">
            </div>
            <div class="field">
              <label class="field-label" for="login-role">利用区分（ローカル検証用ロール選択）</label>
              <select id="login-role" name="role" class="field-control">
                <option value="student">在校生（student）</option>
                <option value="officer">生徒会役員（officer）</option>
                <option value="teacher">顧問教職員（teacher）</option>
                <option value="admin">システム管理者（admin）</option>
              </select>
              <p class="field-help">Firebase Auth 本番接続時は、Firestore の権限ロールが自動的に適用されます。</p>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">ログインする</button>
          </form>
        </div>

        <div style="margin-top:48px;padding-top:28px;border-top:1px solid var(--hairline);">
          <h2 style="font-size:1.0625rem;margin:0 0 8px;">公開前・動作検証用データの切替</h2>
          <p class="field-help" style="margin-bottom:16px;">初期状態は本番公開時と同じ「データ0件」に設定されています。各画面の表示確認を行う場合のみサンプルデータを読み込んでください。</p>
          <div style="display:flex;flex-wrap:wrap;gap:12px;">
            <button type="button" class="btn btn-secondary" id="btn-load-sample">検証用サンプルデータを読み込む</button>
            <button type="button" class="btn btn-secondary" id="btn-clear-sample">本番初期状態（0件）へ初期化</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { initCommonLayout, showToast } from './js/common.js';
    import { loginLocalAccount, isStaffRole } from './js/auth.js';
    import { isFirebaseConfigured } from './js/firebase-config.js';
    import { store } from './js/store.js';

    initCommonLayout('login.html');

    document.getElementById('auth-mode-notice').innerHTML = isFirebaseConfigured()
      ? `<div class="inline-notice is-success">本番 Firebase 認証モードで動作しています。</div>`
      : `<div class="inline-notice">現在 <code>js/firebase-config.js</code> が未設定のため、ローカル検証モードで動作しています。</div>`;

    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const session = loginLocalAccount({
          displayName: fd.get('displayName'),
          email: fd.get('email'),
          role: fd.get('role')
        });
        showToast('ログインしました。');
        setTimeout(() => {
          location.href = isStaffRole(session.role) ? 'admin.html' : 'index.html';
        }, 350);
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('btn-load-sample').addEventListener('click', () => {
      store.enableSampleData();
      showToast('検証用サンプルデータを読み込みました。');
      setTimeout(() => location.reload(), 300);
    });

    document.getElementById('btn-clear-sample').addEventListener('click', () => {
      store.resetToProductionEmpty();
      showToast('本番初期状態（0件）に戻しました。');
      setTimeout(() => location.reload(), 300);
    });
  </script>
</body>
</html>
