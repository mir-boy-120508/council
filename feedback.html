<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意見・質問 | 橘中学校 生徒会公式プラットフォーム</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <div class="container-narrow">
      <nav class="breadcrumb" aria-label="パンくずリスト">
        <ol><li><a href="index.html">ホーム</a></li><li>意見・質問</li></ol>
      </nav>
      <div class="page-header">
        <span class="eyebrow">生徒会公式目安箱</span>
        <h1>意見・質問を送る</h1>
        <p class="page-lead">学校生活の悩み、施設への要望、生徒会への質問などを送信できます。寄せられた内容は公開されず、生徒会執行部が責任をもって確認します。</p>
      </div>
    </div>

    <section class="band-tight">
      <div class="container-narrow">
        <div id="feedback-gate-notice"></div>

        <div class="form-section">
          <form id="form-feedback">
            <div class="field">
              <label class="field-label" for="fb-category">内容の区分<span class="field-req">必須</span></label>
              <select id="fb-category" name="category" class="field-control" required>
                <option value="学校生活・校則">学校生活・校則について</option>
                <option value="施設・環境">施設・安全・環境について</option>
                <option value="行事・委員会">行事・委員会活動について</option>
                <option value="生徒会への質問">生徒会への質問・相談</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="fb-message">意見・質問の内容<span class="field-req">必須</span></label>
              <textarea id="fb-message" name="message" class="field-control" required maxlength="1000" placeholder="具体的な場所・場面や、改善してほしい内容を記入してください。"></textarea>
              <p class="field-help">個人への誹謗中傷やプライバシー侵害にあたる内容は受理できません。</p>
            </div>
            <div class="field">
              <label class="check-label">
                <input type="checkbox" name="wantsReply">
                <span>生徒会からの回答・経過報告を希望する</span>
              </label>
            </div>
            <button type="submit" class="btn btn-primary" id="fb-submit-btn">送信する</button>
          </form>
        </div>

        <div id="fb-complete-msg" style="margin-top:24px;"></div>

        <div class="split-3" style="margin-top:56px;">
          <div class="split-col">
            <h3>1. 非公開で確認</h3>
            <p>送信された意見は公開ページには載らず、生徒会執行部と顧問教職員のみが閲覧します。</p>
          </div>
          <div class="split-col">
            <h3>2. 整理と議題化</h3>
            <p>同様の要望が多い事項は、個人情報を除いたうえで公開提案や協議議題へと整理します。</p>
          </div>
          <div class="split-col">
            <h3>3. 進捗の報告</h3>
            <p>検討結果や対応状況は「活動の進捗」または「お知らせ」にて全校へ報告します。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { initCommonLayout, escapeHtml, showToast } from './js/common.js';
    import { store } from './js/store.js';
    import { getCurrentUser } from './js/auth.js';
    import { evaluateAccessPolicy } from './js/access-control.js';

    initCommonLayout('feedback.html');

    const user = getCurrentUser();
    const policy = evaluateAccessPolicy(store.getState().accessControl, user?.role || 'guest');
    const gateEl = document.getElementById('feedback-gate-notice');
    const submitBtn = document.getElementById('fb-submit-btn');

    if (!user) {
      gateEl.innerHTML = `<div class="inline-notice is-accent">なりすまし防止のため、送信には<a href="login.html" style="color:var(--accent);font-weight:600;text-decoration:underline;">ログイン</a>が必要です。</div>`;
      submitBtn.disabled = true;
    } else if (policy.restricted) {
      gateEl.innerHTML = `<div class="inline-notice is-warning">${escapeHtml(policy.reason)}</div>`;
      submitBtn.disabled = true;
    }

    document.getElementById('form-feedback').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!user || policy.restricted) return;
      const fd = new FormData(e.target);
      store.submitFeedback({
        category: fd.get('category'),
        content: fd.get('message'),
        wantsReply: fd.get('wantsReply') === 'on'
      }, user);
      e.target.reset();
      showToast('意見・質問を送信しました。');
      document.getElementById('fb-complete-msg').innerHTML = `
        <div class="inline-notice is-success">
          <strong>送信を受け付けました。</strong><br>
          生徒会執行部にて内容を確認のうえ、今後の定例会議で検討いたします。
        </div>
      `;
    });
  </script>
</body>
</html>
