<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfd">
  <meta name="description" content="生徒から生徒会へ意見・質問・要望を送信する非公開窓口。">
  <title>意見・質問 — 橘中学校 生徒会公式プラットフォーム</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="feedback">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <nav class="breadcrumb" aria-label="現在位置">
        <ol>
          <li><a href="index.html">ホーム</a></li>
          <li aria-current="page">意見・質問</li>
        </ol>
      </nav>
    </div>

    <section class="page-header">
      <div class="container">
        <p class="page-header-eyebrow">生徒会への直接窓口</p>
        <h1>意見・質問</h1>
        <p class="page-header-lead">日々の学校生活での気づき、校内環境への要望、生徒会への質問をお送りください。送信内容は一般公開されません。</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:780px;">
        <div id="feedback-schedule-banner"></div>
        <div id="feedback-form-area"></div>

        <div class="editorial-grid-3" style="margin-top:56px;">
          <div class="editorial-item">
            <span class="editorial-item-num">段階 01</span>
            <h3>生徒会が内容を確認</h3>
            <p>受付した意見や質問を生徒会執行部が確認し、カテゴリーごとに整理します。</p>
          </div>
          <div class="editorial-item">
            <span class="editorial-item-num">段階 02</span>
            <h3>検討・提案への移行</h3>
            <p>全校で意見を募るべきテーマは、個人情報を除いた形で「提案・署名」へ移行します。</p>
          </div>
          <div class="editorial-item">
            <span class="editorial-item-num">段階 03</span>
            <h3>結果と対応の共有</h3>
            <p>個人が特定されない形で、お知らせや「活動の進捗」を通じて対応状況を報告します。</p>
          </div>
        </div>

        <div class="related-links">
          <p class="related-links-title">関連ページ</p>
          <div class="related-links-grid">
            <a class="related-link-item" href="petitions.html"><span>公開で提案・署名を行う</span><span>›</span></a>
            <a class="related-link-item" href="privacy.html"><span>個人情報の取り扱いを見る</span><span>›</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/site.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
