<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfd">
  <meta name="description" content="生徒から出された提案や生徒会活動の進行段階・学校との協議結果を公開します。">
  <title>活動の進捗 — 橘中学校 生徒会公式プラットフォーム</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="progress">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <nav class="breadcrumb" aria-label="現在位置">
        <ol>
          <li><a href="index.html">ホーム</a></li>
          <li aria-current="page">活動の進捗</li>
        </ol>
      </nav>
    </div>

    <section class="page-header">
      <div class="container">
        <p class="page-header-eyebrow">活動プロセスの可視化</p>
        <h1>活動の進捗</h1>
        <p class="page-header-lead">受付した提案が現在どの段階にあり、学校側とどのような協議を行っているかを公開します。実現しなかった場合も理由を説明します。</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="toolbar">
          <div class="filter-pills" role="group" aria-label="対応状況絞り込み">
            <button type="button" class="filter-pill active" data-prg-status="all">すべて</button>
            <button type="button" class="filter-pill" data-prg-status="in_progress">対応中</button>
            <button type="button" class="filter-pill" data-prg-status="completed">完了</button>
            <button type="button" class="filter-pill" data-prg-status="not_realized">実現しなかった</button>
            <button type="button" class="filter-pill" data-prg-status="not_started">未着手</button>
          </div>
        </div>

        <div id="progress-list-container"></div>

        <div class="related-links">
          <p class="related-links-title">関連ページ</p>
          <div class="related-links-grid">
            <a class="related-link-item" href="petitions.html"><span>新しい提案・署名を見る</span><span>›</span></a>
            <a class="related-link-item" href="feedback.html"><span>意見・質問を送る</span><span>›</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/site.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
